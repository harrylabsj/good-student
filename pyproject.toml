[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "good-student"
version = "0.1.1"
description = "错题诊断与学习行动：Plugin + Skill + 确定性核心（M0：协议与可信底座）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.20"]

[project.optional-dependencies]
# mcp>=2.0：mcp/server.py 使用 mcp.server.mcpserver.MCPServer（2.x 模块布局）；
# 1.x 是 mcp.server.fastmcp.FastMCP，与本文件不兼容。
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
good-student = "good_student.cli:main"
good-student-mcp = "good_student.mcp_server:main"

[tool.setuptools]
packages = ["good_student", "good_student.schemas", "good_student.knowledge_packs"]
package-dir = {good_student = "core/good_student", "good_student.schemas" = "schemas", "good_student.knowledge_packs" = "knowledge_packs"}

[tool.setuptools.package-data]
"good_student.schemas" = ["*.json"]
"good_student.knowledge_packs" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
